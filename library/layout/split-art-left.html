<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{width:1280px;height:720px;background:#fff}
  .frame{display:grid;grid-template-columns:560px 1fr;align-items:center;padding:0 90px 0 70px;height:100%}
  .art{width:460px;height:460px;border-radius:50%;background:#d9d9d9;justify-self:center;position:relative}
  .art i{position:absolute;inset:40px;background:#bdbdbd}
  .txt{padding-left:30px;display:flex;flex-direction:column}
  .box{background:#cfcfcf}
  .num{width:90px;height:26px}
  .title{width:372px;height:200px;margin:6px 0 10px}
  .date{width:200px;height:40px}
  .body{width:480px;height:110px;margin-top:22px}
</style></head><body>
  <div class="frame">
    <div class="art"><i></i></div>
    <div class="txt">
      <div class="box num"></div>
      <div class="box title"></div>
      <div class="box date"></div>
      <div class="box body"></div>
    </div>
  </div>
</body></html>
