<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>60秒でわかる日本の歴史</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E9E6DF; --chrome:#1E2A36; --muted:#5E6A74; --bar:#CFCAC0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#12181E; --chrome:#E6E2D8; --muted:#8E99A2; --bar:#2A333C; }
}
:root[data-theme="dark"]{ --page:#12181E; --chrome:#E6E2D8; --muted:#8E99A2; --bar:#2A333C; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--chrome);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;display:flex;align-items:center;justify-content:center}
.wrap{width:min(100vw - 24px, 1100px, (100vh - 150px) * 16 / 9);min-width:300px}
.viewport{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#1E2A36}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;font-family:"Zen Kaku Gothic New",sans-serif}
.scene{position:absolute;inset:0;background:var(--bg);color:var(--ink);visibility:hidden;display:grid;grid-template-columns:560px 1fr;align-items:center;padding:0 90px 0 70px}
.scene.prev{visibility:visible;z-index:1}
.scene.active{visibility:visible;z-index:2;animation:wipe .55s cubic-bezier(.7,0,.2,1) both}
@keyframes wipe{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
.art{position:relative;width:460px;height:460px;justify-self:center}
.art .disc{position:absolute;inset:0;border-radius:50%;background:var(--disc)}
.art svg{position:absolute;inset:40px;width:380px;height:380px}
.active .disc{animation:pop .6s .15s cubic-bezier(.3,1.5,.5,1) both}
.active .art svg{animation:pop .7s .3s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.txt{padding-left:30px}
.num{font-size:26px;font-weight:700;opacity:.7;letter-spacing:.04em}
.era{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:var(--es,190px);line-height:1.05;margin:6px 0 10px;letter-spacing:-.02em}
.date{font-size:40px;font-weight:700;color:var(--acc)}
.fact{font-size:38px;font-weight:700;line-height:1.45;margin:22px 0 0;max-width:15em}
.active .num,.active .era,.active .date,.active .fact{animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both}
.active .num{animation-delay:.3s}.active .era{animation-delay:.38s}.active .date{animation-delay:.52s}.active .fact{animation-delay:.66s}
@keyframes rise{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
/* title & end cards */
.card{grid-template-columns:1fr;text-align:center;justify-items:center;padding:0}
.card .big{font-family:"Dela Gothic One",sans-serif;font-size:170px;line-height:1.1;margin:0}
.card .small{font-size:44px;font-weight:700;color:var(--acc);margin-top:18px}
.card .sun{width:150px;height:150px;border-radius:50%;background:#D0413A;margin-bottom:30px}
.active .sun{animation:pop .6s .1s cubic-bezier(.3,1.6,.5,1) both}
.active .big{animation:rise .55s .3s cubic-bezier(.2,.9,.3,1.2) both}
.active .small{animation:rise .5s .55s cubic-bezier(.2,.9,.3,1.2) both}
.paused .stage *{animation-play-state:paused!important}
/* timeline */
.tl{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(0,0,0,.25);z-index:5}
.tl i{display:block;height:100%;width:0;background:#fff}
/* controls */
.ctrl{display:flex;align-items:center;gap:12px;margin-top:14px}
button{font:inherit;font-weight:700;font-size:15px;color:var(--page);background:var(--chrome);border:0;border-radius:999px;padding:10px 20px;cursor:pointer}
button.ghost{background:transparent;color:var(--chrome);box-shadow:inset 0 0 0 2px var(--chrome)}
button:focus-visible{outline:3px solid #2E7DB5;outline-offset:3px}
.time{margin-left:auto;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.eras{display:flex;gap:4px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.eras button{flex:0 0 auto;font-size:13px;padding:6px 10px;background:var(--bar);color:var(--chrome)}
.eras button.on{background:var(--chrome);color:var(--page)}
@media (prefers-reduced-motion: reduce){.stage *{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="viewport" id="vp">
    <div class="stage" id="stage"></div>
    <div class="tl"><i id="bar"></i></div>
  </div>
  <div class="ctrl">
    <button id="play">一時停止</button>
    <button class="ghost" id="restart">最初から</button>
    <span class="time" id="time">0:00 / 1:00</span>
  </div>
  <div class="eras" id="eras"></div>
</div>

scenes.push({el:mk(`<div class="sun"></div><h1 class="big">日本の歴史</h1><div class="small">縄文から令和まで、60秒で</div>`,'--bg:#F4F1EC;--ink:#1E2A36;--acc:#C73A33','card'),dur:INTRO,label:'はじめ'});

let acc=0; scenes.forEach(s=>{s.start=acc;acc+=s.dur}); const TOTAL=acc;

const vp=document.getElementById('vp');
function fit(){stage.style.transform=`scale(${vp.clientWidth/1280})`}
addEventListener('resize',fit); fit();

const erasBox=document.getElementById('eras');
scenes.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.label;b.onclick=()=>seek(s.start+0.001);erasBox.appendChild(b);s.btn=b;});

let t=0, playing=true, last=performance.now(), cur=-1;
function show(i){
  if(i===cur) return;
  scenes.forEach((s,j)=>{s.el.classList.remove('active','prev');s.btn.classList.toggle('on',j===i)});
  if(cur>=0 && cur!==i) scenes[cur].el.classList.add('prev');
  const el=scenes[i].el; void el.offsetWidth; el.classList.add('active');
  scenes[i].btn.scrollIntoView({block:'nearest',inline:'nearest'});
  cur=i;
}
function idx(tt){for(let i=scenes.length-1;i>=0;i--) if(tt>=scenes[i].start) return i; return 0;}
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function seek(tt){t=Math.max(0,Math.min(tt,TOTAL));cur=-1;show(idx(t));if(!playing)toggle();}
function tick(now){
  const dt=(now-last)/1000; last=now;
  if(playing){t+=dt; if(t>=TOTAL){t=TOTAL;playing=false;document.getElementById('play').textContent='再生';vp.classList.add('paused');}}
  show(idx(Math.min(t,TOTAL-0.001)));
  document.getElementById('bar').style.width=(t/TOTAL*100)+'%';
  document.getElementById('time').textContent=`${fmt(t)} / ${fmt(TOTAL)}`;
  requestAnimationFrame(tick);
}
function toggle(){
  if(!playing && t>=TOTAL){t=0;cur=-1;}
  playing=!playing; document.getElementById('play').textContent=playing?'一時停止':'再生';
  vp.classList.toggle('paused',!playing);
}
document.getElementById('play').onclick=toggle;
document.getElementById('restart').onclick=()=>seek(0);
vp.onclick=toggle;
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.key==='ArrowRight') seek(scenes[Math.min(cur+1,scenes.length-1)].start+0.001);
  if(e.key==='ArrowLeft') seek(scenes[Math.max(cur-1,0)].start+0.001);
});
requestAnimationFrame(tick);
</script>
</body>
</html>
